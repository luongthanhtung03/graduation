<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Maker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    --ink: #17110d;
    --panel: #211812;
    --cream: #f3e6d6;
    --soft: #b29c88;
    --warm: #eba56c;
    --hair: rgba(235, 165, 108, .22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--cream); overscroll-behavior: none; }
  body { font-family: "Be Vietnam Pro", system-ui, sans-serif; font-weight: 300; font-size: 15px; line-height: 1.6; }
  main { max-width: 600px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-family: "Lora", Georgia, serif; font-weight: 600; font-size: 28px; margin: 0 0 4px; color: #ffd3a3; }
  .sub { color: var(--soft); margin: 0 0 20px; font-size: 14px; }
  label { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 18px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; font-weight: 400; color: var(--cream); background: var(--panel);
    border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--warm); }
  .hint { font-size: 12px; color: var(--soft); margin-top: 4px; }
  .hint code { color: var(--warm); }
  .out { margin-top: 28px; padding: 14px; border: 1px solid var(--hair); border-radius: 10px; background: var(--panel); }
  .link { font-size: 12px; word-break: break-all; color: var(--soft); max-height: 4.8em; overflow: hidden; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
  .len { font-size: 12px; color: var(--soft); }
  button, .btn {
    font: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 8px 18px; cursor: pointer;
    border: 1px solid var(--warm); text-decoration: none; text-align: center;
  }
  .primary { background: var(--warm); color: var(--ink); }
  .ghost { background: none; color: var(--warm); }
  h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); font-weight: 400; margin: 36px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(235, 165, 108, .1); font-size: 14px; }
  li .acts { display: flex; gap: 6px; flex: none; }
  li button { padding: 4px 12px; font-size: 12px; }
  .empty { color: var(--soft); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Tạo link mời</h1>
  <p class="sub">Chỉ dành cho Tùng. Viết tên và lời nhắn, rồi copy link gửi cho người đó.</p>

  <label for="name">Tên khách</label>
  <input id="name" placeholder="vd: Minh, cô Hai, thầy Nam" maxlength="40" autocomplete="off">
  <div class="hint">Hiện ở màn hình terminal và thay cho <code>{n}</code> bên dưới.</div>

  <label for="preset">Mẫu (chọn để điền sẵn, rồi sửa tuỳ ý)</label>
  <select id="preset">
    <option value="friend">Bạn bè</option>
    <option value="family">Gia đình</option>
    <option value="teacher">Thầy cô</option>
    <option value="work">Đồng nghiệp</option>
  </select>

  <label for="dear">Lời chào</label>
  <input id="dear" maxlength="120" autocomplete="off">

  <label for="msg">Lời nhắn</label>
  <textarea id="msg" maxlength="1500"></textarea>
  <div class="hint"><code>{n}</code> = tên khách. Xuống dòng sẽ được giữ nguyên.</div>

  <div class="out">
    <div class="link" id="link"></div>
    <div class="row">
      <button class="primary" id="copy">Copy link</button>
      <a class="btn ghost" id="open" target="_blank" rel="noopener">Xem thử</a>
      <span class="len" id="len"></span>
    </div>
  </div>

  <h2>Đã copy gần đây (chỉ lưu trên máy này)</h2>
  <ul id="history"></ul>
</main>

<script>
// Same wording as the default messages in index.html
const ME = "Tùng";
const PRESETS = {
  friend:  { dear: "Gửi {n},",      msg: `Sau 4 năm debug cuộc đời, ${ME} cuối cùng cũng merge được vào nhánh main. Tới chụp hình, chung vui với mình nha!` },
  family:  { dear: "Kính gửi {n},", msg: `${ME} trân trọng kính mời {n} đến chung vui ngày tốt nghiệp. Có mọi người ở đó là món quà lớn nhất với ${ME}.` },
  teacher: { dear: "Kính gửi {n},", msg: "Em xin trân trọng kính mời {n} đến dự buổi chụp hình tốt nghiệp của em. Cảm ơn {n} đã dạy dỗ em suốt những năm qua." },
  work:    { dear: "Gửi {n},",      msg: `${ME} trân trọng mời {n} ghé chung vui ngày tốt nghiệp của ${ME}. Rất mong được gặp {n} ở đó!` },
};

const $ = id => document.getElementById(id);
const nameEl = $("name"), presetEl = $("preset"), dearEl = $("dear"), msgEl = $("msg");

// The invite lives next to this page. Online, "./" is the clean URL; as a local file it must be "index.html".
const base = new URL(location.protocol === "file:" ? "index.html" : "./", location.href);

// JSON -> UTF-8 bytes -> base64url (URL-safe: + becomes -, / becomes _, no = padding)
function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function makeLink() {
  const url = new URL(base);
  url.searchParams.set("i", pack({ n: nameEl.value.trim(), d: dearEl.value.trim(), m: msgEl.value.trim() }));
  return url.toString();
}

function update() {
  const link = makeLink();
  $("link").textContent = link;
  $("open").href = link;
  $("len").textContent = `${link.length} ký tự`;
}

function fillPreset() {
  dearEl.value = PRESETS[presetEl.value].dear;
  msgEl.value = PRESETS[presetEl.value].msg;
  update();
}

function loadHistory() { try { return JSON.parse(localStorage.getItem("made") || "[]"); } catch { return []; } }
function saveHistory(list) { try { localStorage.setItem("made", JSON.stringify(list.slice(0, 100))); } catch {} }

function showHistory() {
  const list = loadHistory();
  const ul = $("history");
  ul.innerHTML = "";
  if (!list.length) { ul.innerHTML = `<li class="empty">Chưa có link nào.</li>`; return; }
  for (const item of list) {
    const li = document.createElement("li");
    const who = document.createElement("span");
    who.textContent = item.name || "(không tên)";
    const acts = document.createElement("span");
    acts.className = "acts";
    const edit = document.createElement("button");
    edit.className = "ghost"; edit.textContent = "Sửa";
    edit.onclick = () => { nameEl.value = item.name; dearEl.value = item.dear; msgEl.value = item.msg; update(); scrollTo(0, 0); };
    const again = document.createElement("button");
    again.className = "ghost"; again.textContent = "Copy lại";
    again.onclick = () => copy(item.link, again);
    acts.append(edit, again);
    li.append(who, acts);
    ul.appendChild(li);
  }
}

async function copy(text, btn) {
  const old = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Đã copy ✓";
  } catch {
    // clipboard can be blocked (old browser, no permission): select the text so it can be copied by hand
    getSelection().selectAllChildren($("link"));
    btn.textContent = "Bấm Cmd/Ctrl+C";
  }
  setTimeout(() => btn.textContent = old, 1500);
}

$("copy").onclick = async () => {
  if (!nameEl.value.trim()) { nameEl.focus(); return; }
  const link = makeLink();
  await copy(link, $("copy"));
  // one entry per name: copying again for the same person replaces the old link
  const name = nameEl.value.trim();
  const list = loadHistory().filter(x => x.name !== name);
  list.unshift({ name, dear: dearEl.value.trim(), msg: msgEl.value.trim(), link });
  saveHistory(list);
  showHistory();
};

nameEl.oninput = dearEl.oninput = msgEl.oninput = update;
presetEl.onchange = fillPreset;
fillPreset();
showHistory();
nameEl.focus();
</script>
</body>
</html>
