<style>
  :root {
    /* terminal (stage 1) */
    --bg: #0b0f14;
    --bar: #151b23;
    --line: #232d39;
    --text: #d7e0ea;
    --muted: #6f7d8b;
    --green: #3ddc84;
    --amber: #ffb547;
    --red: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    /* warm (stage 2 + 3) */
    --ink: #17110d;
    --cream: #f3e6d6;
    --soft: #b29c88;
    --warm: #eba56c;
    --warm-hi: #ffd3a3;
    --hair: rgba(235, 165, 108, .22);
    --serif: "Lora", Georgia, serif;
    --sans: "Be Vietnam Pro", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: var(--mono); font-size: 15px; line-height: 1.6; min-height: 100vh; }
  @media (max-width: 420px) { body { font-size: 13px; } }
  html.warm, html.warm body { background: var(--ink); transition: background .8s; }
  html { overscroll-behavior: none; }

  /* ========== Stage 1: terminal intro ========== */
  #intro { transition: opacity .4s; }
  #intro.gone { opacity: 0; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  }
  header i { width: 12px; height: 12px; border-radius: 50%; display: block; flex: none; }
  header i:nth-child(1) { background: var(--red); }
  header i:nth-child(2) { background: var(--amber); }
  header i:nth-child(3) { background: var(--green); }
  header .title { color: var(--muted); font-size: 12px; flex: 1; text-align: center; margin-right: 52px;
                  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #term { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
  #out { white-space: pre-wrap; overflow-wrap: anywhere; }
  .prompt, .ok { color: var(--green); }
  .dim { color: var(--muted); }
  .big { color: var(--amber); font-weight: 700; }
  .cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--green);
            vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ========== Stage 2: the cap ========== */
  #show {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 45%, #2b1d14 0%, var(--ink) 68%);
    transition: opacity .9s;
  }
  #show.on { display: grid; }
  #show.gone { opacity: 0; }
  #show .stage { transition: opacity .25s; }
  #show .stage.hide { opacity: 0; }
  #cap { width: min(78vw, 360px); overflow: visible; }
  #cap .stroke { fill: none; stroke: #f2b880; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  #cap .thin { stroke-width: .8; opacity: .75; }
  #cap .fill { opacity: 0; transition: opacity 1.1s; }
  #cap.filled .fill { opacity: 1; }
  #cap.filled { filter: drop-shadow(0 0 16px rgba(235, 165, 108, .3)); transition: filter 1s; }
  #tassel { transform-origin: 200px 101px; }
  #cap.filled #tassel { animation: swing 2.4s ease-in-out infinite; }
  @keyframes swing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
  .show-text { margin-top: 22px; opacity: 0; transform: translateY(10px); transition: opacity 1s, transform 1s; }
  .show-text.on { opacity: 1; transform: none; }
  .show-text .pre { font-family: var(--sans); font-size: 13px; letter-spacing: .2em; color: var(--soft); text-transform: uppercase; }
  .show-text .headline { font-family: var(--serif); font-weight: 600; font-size: clamp(32px, 9vw, 54px); margin-top: 4px; line-height: 1.15; color: var(--warm-hi); }
  #sparks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* ========== Stage 3: the invitation ========== */
  #final {
    display: none; opacity: 0; transition: opacity 1.2s;
    font-family: var(--sans); font-weight: 300; color: var(--cream); font-size: 15px; line-height: 1.7;
    font-variant-numeric: lining-nums;
    background:
      radial-gradient(ellipse at 10% 0%, rgba(235, 165, 108, .14), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(200, 110, 60, .10), transparent 55%),
      var(--ink);
    min-height: 100vh;
  }
  #final.on { display: block; }
  #final.visible { opacity: 1; }
  #final a { color: var(--warm); text-decoration: none; border-bottom: 1px solid var(--hair); }
  #final a:hover { border-bottom-color: var(--warm); }

  #lang {
    position: fixed; top: 14px; right: 16px; z-index: 6; font-family: var(--sans); font-size: 12px; letter-spacing: .1em;
    background: rgba(23, 17, 13, .75); border: 1px solid var(--hair); border-radius: 999px; color: var(--soft); padding: 4px 12px; cursor: pointer;
  }
  #lang b { color: var(--warm); font-weight: 600; }

  .wrap {
    max-width: 1080px; margin: 0 auto; padding: 64px 24px 64px;
    display: grid; grid-template-columns: 5fr 7fr; gap: 56px; align-items: start;
  }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 36px; padding: 60px 16px 48px; }
  }

  .portrait { position: sticky; top: 64px; margin: 0; }
  @media (max-width: 820px) { .portrait { position: static; max-width: 420px; margin: 0 auto; width: 100%; } }
  .portrait img {
    display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%;
    border-radius: 18px; box-shadow: 0 20px 60px -20px rgba(235, 140, 70, .35), 0 0 0 1px var(--hair);
  }
  @media (min-width: 821px) { .portrait img { max-height: calc(100vh - 240px); } }
  .portrait figcaption { text-align: center; margin-top: 22px; }
  .portrait .who { font-family: var(--serif); font-weight: 600; font-size: 26px; color: var(--warm-hi); line-height: 1.3; }
  .portrait .faculty { margin-top: 6px; font-size: 14px; color: var(--cream); }
  .portrait .school { font-size: 13px; color: var(--soft); }

  .eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--warm); font-weight: 400; }
  .heading { font-family: var(--serif); font-weight: 600; font-size: clamp(32px, 6vw, 52px); line-height: 1.15; margin: 8px 0 28px; }
  .heading em { color: var(--warm); font-style: italic; font-weight: 500; }
  .dear { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--warm-hi); margin: 0 0 8px; }
  .msg { margin: 0; font-size: 16px; white-space: pre-line; }

  .rule { display: flex; align-items: center; gap: 14px; margin: 38px 0 22px; color: var(--warm); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hair), transparent); }

  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 24px; margin: 0; }
  .details div { border-left: 2px solid var(--hair); padding-left: 14px; }
  .details .wide { grid-column: 1 / -1; }
  .details dt { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .details dd { margin: 2px 0 0; font-family: var(--serif); font-weight: 600; font-size: 21px; color: var(--cream); line-height: 1.35; }
  .details dd small { display: block; font-family: var(--sans); font-weight: 300; font-size: 13px; color: var(--soft); margin-top: 4px; }
  @media (max-width: 420px) { .details { grid-template-columns: 1fr; } }

  .links { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; font-size: 14px; }

  .gates { list-style: none; padding: 0; margin: 0 0 14px; }
  .gates li { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(235, 165, 108, .1); }
  .gates b { font-family: var(--serif); color: var(--warm); font-weight: 600; min-width: 64px; }
  .tip { color: var(--warm-hi); margin: 0 0 16px; }
  .map { position: relative; display: block; border: 0 !important; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair); }
  .map img { display: block; width: 100%; }
  .pin {
    position: absolute; left: 44.5%; top: 40%; transform: translate(-50%, -100%);
    background: var(--warm); color: var(--ink); font-weight: 600; font-size: 11px; letter-spacing: .05em; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; animation: bob 1.4s ease-in-out infinite;
  }
  .pin::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
                border: 5px solid transparent; border-top-color: var(--warm); }
  @keyframes bob { 50% { margin-top: -5px; } }
  .hint { font-size: 12px; color: var(--soft); margin-top: 6px; }

  .contact { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; }
  .contact dt { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); padding-top: 2px; }
  .contact dd { margin: 0; }

  .sign { margin-top: 44px; font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--warm-hi); }
</style>
</head>

<!-- Stage 1 -->
<div id="intro">

    <i></i><i></i><i></i>

  </header>

<!-- Stage 2 -->
<div id="show" aria-hidden="true">
  <div class="stage">
    <svg id="cap" viewBox="0 0 260 230">
      <defs>
        <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd9a8"/>

<main id="final">

  <div class="wrap">

<script>
// ===== Settings: edit these =====
const ME = "Tùng"; // short name, used inside messages
const FULL_NAME = "Lương Thanh Tùng";
const FB = "https://www.facebook.com/tung.luong.884431";
const MAPS = "https://www.google.com/maps/dir/?api=1&destination=" +
  encodeURIComponent("Trường Đại học Bách khoa 268 Lý Thường Kiệt");

// Who the guest is: ?to=Minh&g=family
// g = friend (default) | family | teacher | work
// Each group has its own message, because Vietnamese changes pronouns by relationship.
// {n} is replaced by the guest's name.
const GREETINGS = {
  friend: {
    vi: { dear: "Gửi {n},", msg: `Sau 4 năm debug cuộc đời, ${ME} cuối cùng cũng merge được vào nhánh main. Tới chụp hình, chung vui với mình nha!` },
    en: { dear: "Dear {n},", msg: "After 4 years of debugging life, I finally merged into main. Come take photos and celebrate with me!" },
  },
  family: {
    vi: { dear: "Kính gửi {n},", msg: `${ME} trân trọng kính mời {n} đến chung vui ngày tốt nghiệp. Có mọi người ở đó là món quà lớn nhất với ${ME}.` },
    en: { dear: "Dear {n},", msg: "I would be so happy to have you at my graduation. Having you there means the world to me." },
  },
  teacher: {
    vi: { dear: "Kính gửi {n},", msg: "Em xin trân trọng kính mời {n} đến dự buổi chụp hình tốt nghiệp của em. Cảm ơn {n} đã dạy dỗ em suốt những năm qua." },
    en: { dear: "Dear {n},", msg: "It would be an honor to have you at my graduation. Thank you for teaching me all these years." },
  },
  work: {
    vi: { dear: "Gửi {n},", msg: `${ME} trân trọng mời {n} ghé chung vui ngày tốt nghiệp của ${ME}. Rất mong được gặp {n} ở đó!` },
    en: { dear: "Dear {n},", msg: "I'd love for you to join my graduation. Hope to see you there!" },
  },
};

const TEXT = {
  vi: {
    showPre: "Thư mời dự", showTitle: "Lễ Tốt Nghiệp",
    lang: `<b>VI</b> · EN`,
    faculty: "Khoa Khoa học và Kỹ thuật Máy tính",
    school: "Trường Đại học Bách Khoa – Đại học Quốc gia TP.HCM",
    eyebrow: "Thư mời dự lễ tốt nghiệp",
    title: `Chung vui <em>ngày tốt nghiệp</em>`,
    fallback: "bạn",
    whenWhere: "Thời gian & địa điểm",
    dateL: "Ngày", date: "Thứ Bảy, 28.11.2026",
    timeL: "Giờ", timeNote: "Lễ của khoa bắt đầu 14:30, tới 15:30 là vừa đẹp",
    placeL: "Địa điểm", place: "Trước Hội trường A5<small>ĐH Bách Khoa TP.HCM · 268 Lý Thường Kiệt, Q.10</small>", // TODO: confirm meeting point
    gcal: "Thêm vào Google Calendar →", ics: "Lịch iPhone (.ics) →",
    routeL: "Đường đến A5",
    g1: "Cổng 1", g2: "Cổng 2", g3: "Cổng 3", main: "(cổng chính)",
    tip: "Gần A5 nhất là cổng 2: vào cổng, đi thẳng qua A1, A2 là tới A5.", // TODO: confirm
    zoom: "Bấm vào bản đồ để phóng to",
    gmaps: "Chỉ đường bằng Google Maps →",
    contactL: "Liên hệ",
    sign: `Hẹn gặp tại Bách Khoa — ${FULL_NAME}`,
  },
  en: {
    showPre: "You're invited to my", showTitle: "Graduation",
    lang: `VI · <b>EN</b>`,
    faculty: "Faculty of Computer Science and Engineering",
    school: "Ho Chi Minh City University of Technology – VNU-HCM",
    eyebrow: "Graduation invitation",
    title: `Celebrate my <em>graduation</em>`,
    fallback: "friend",
    whenWhere: "When & where",
    dateL: "Date", date: "Saturday, Nov 28, 2026",
    timeL: "Time", timeNote: "My faculty's ceremony starts at 14:30, so 15:30 is perfect",
    placeL: "Place", place: "In front of Hall A5<small>HCMUT (Bach Khoa) · 268 Ly Thuong Kiet, District 10</small>",
    gcal: "Add to Google Calendar →", ics: "Apple Calendar (.ics) →",
    routeL: "Getting to A5",
    g1: "Gate 1", g2: "Gate 2", g3: "Gate 3", main: "(main gate)",
    tip: "Gate 2 is closest to A5: walk straight past A1 and A2, and A5 is right there.",
    zoom: "Tap the map to zoom",
    gmaps: "Directions in Google Maps →",
    contactL: "Contact",
    sign: `See you at Bach Khoa! — ${FULL_NAME}`,
  },
};

// ===== Read the guest from the URL =====
const params = new URLSearchParams(location.search);
// The name is escaped before it goes into HTML, so a link like ?to=<script> cannot run code.
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// A custom invite comes packed in ?i= (made by make.html): base64url of JSON { n: name, d: greeting line, m: message }.
// It is only packed to keep the link short, not secret. Bad or old links fall back to ?to= / ?g=.
function readInvite() {
  const raw = params.get("i");
  if (!raw) return {};
  try {
    const bin = atob(raw.replace(/-/g, "+").replace(/_/g, "/"));
    const obj = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    const str = (v, max) => typeof v === "string" ? v.trim().slice(0, max) : "";
    return { n: str(obj.n, 40), d: str(obj.d, 120), m: str(obj.m, 1500) };
  } catch { return {}; }
}
const custom = readInvite();
const rawName = (custom.n || params.get("to") || "").trim().slice(0, 40);
const group = GREETINGS[params.get("g")] ? params.get("g") : "friend";
const termName = escapeHtml(rawName || "guest");

// ===== Language =====
function getSavedLang() { try { return localStorage.getItem("lang"); } catch { return null; } }
function saveLang(l) { try { localStorage.setItem("lang", l); } catch {} }
let lang = ["vi", "en"].includes(params.get("lang")) ? params.get("lang") : (getSavedLang() || "vi");

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  // data-html marks the few strings that contain our own markup; everything else is plain text.
  document.querySelectorAll("#final [data-t]").forEach(el => {
    if (el.hasAttribute("data-html")) el.innerHTML = t[el.dataset.t];
    else el.textContent = t[el.dataset.t];
  });
  const g = GREETINGS[group][lang];
  const n = rawName || t.fallback;
  // textContent, never innerHTML: the text comes from the link, so it must not be able to inject HTML
  document.getElementById("dear").textContent = (custom.d || g.dear).replaceAll("{n}", n);
  document.getElementById("msg").textContent = (custom.m || g.msg).replaceAll("{n}", n);
  document.getElementById("lang").innerHTML = t.lang;
}

// ===== Links =====
// 15:30–17:00 Vietnam time (UTC+7) = 08:30–10:00 UTC
const EVENT = {
  title: `Tốt nghiệp của ${ME} 🎓`,
  start: "20261128T083000Z", end: "20261128T100000Z",
  place: "Trường ĐH Bách Khoa TP.HCM, 268 Lý Thường Kiệt, Quận 10",
};
document.getElementById("gcal").href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
  action: "TEMPLATE", text: EVENT.title, dates: `${EVENT.start}/${EVENT.end}`, location: EVENT.place,
});
document.getElementById("ics").onclick = e => {
  e.preventDefault();
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//grad-invite//EN", "BEGIN:VEVENT",

    `DTSTART:${EVENT.start}`, `DTEND:${EVENT.end}`,
    `SUMMARY:${EVENT.title}`, `LOCATION:${EVENT.place.replace(/,/g, "\\,")}`,
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "graduation.ics";
  a.click();
};
document.getElementById("gmaps").href = MAPS;
document.getElementById("fb").href = FB;
document.getElementById("who").textContent = FULL_NAME;
document.getElementById("lang").onclick = () => { lang = lang === "vi" ? "en" : "vi"; saveLang(lang); render(); };

// ===== Stage 1: terminal intro =====
const out = document.getElementById("out");
const sleep = ms => new Promise(r => setTimeout(r, ms));
let stage = 1;

function line(html = "") {
  const el = document.createElement("span");
  el.innerHTML = html;
  out.appendChild(el);
  out.append("\n");
  return el;
}

async function typeCmd(text, speed, check = () => false) {
  const el = document.createElement("span");
  el.innerHTML = `<span class="prompt">${termName}@hcmut:~$ </span>`;
  out.appendChild(el);
  for (const ch of text) {
    if (check()) return;
    el.append(ch);
    if (speed) await sleep(speed + Math.random() * speed);
  }
  out.append("\n");
  if (speed) await sleep(250);
}

async function runIntro() {
  const stop = () => stage !== 1;
  await typeCmd("ssh guest@graduation.hcmut", 40, stop);           if (stop()) return;
  line(`<span class="dim">Connecting to HCMUT... connected.</span>`); await sleep(350);
  await typeCmd("whoami", 40, stop);                                if (stop()) return;
  line(`<span class="ok">${termName}</span>`);                       await sleep(350);
  await typeCmd(`sudo ./invite --guest "${rawName || "guest"}"`, 40, stop); if (stop()) return;
  line(`[sudo] verifying friendship level...`);
  const bar = line();
  for (let i = 0; i <= 20; i++) {
    if (stop()) return;
    bar.innerHTML = `[<span class="ok">${"█".repeat(i)}</span>${"░".repeat(20 - i)}] ${i * 5}%`;
    await sleep(60);
  }
  for (const msg of ["Loading 4 years of deadlines...", "Compiling bugs into skills.....", "Turning coffee into a degree..."]) {
    if (stop()) return;
    line(`<span class="dim">${msg} </span><span class="ok">done</span>`);
    await sleep(350);
  }
  line(`<span class="ok">✔ Access granted.</span>`);
  line(`\n<span class="big">  ${ME} has graduated! 🎓</span>\n  You are invited to the celebration.\n`);
  await sleep(600);                                                  if (stop()) return;
  goStage2();
}

// ===== Particle canvas (sparkles + dust), no library =====
const fx = (() => {
  const c = document.getElementById("sparks"), ctx = c.getContext("2d");
  let bits = [], running = false;
  function size() { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener("resize", size); size();
  function add(list) { bits.push(...list); if (!running) { running = true; requestAnimationFrame(frame); } }
  function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits = bits.filter(b => b.life > 0);
    for (const b of bits) b.step(ctx, now);
    ctx.globalAlpha = 1;
    if (bits.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  return { add };
})();

function sparkBurst(x, y, n) {
  const colors = ["#ffd3a3", "#eba56c", "#fff0dc", "#d9894f"];
  fx.add(Array.from({ length: n }, (_, i) => {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 4;
    const b = { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, r: .6 + Math.random() * 1.8,
                life: 1, decay: .007 + Math.random() * .012, tw: Math.random() * 6, color: colors[i % colors.length] };
    b.step = ctx => {
      b.x += b.vx; b.y += b.vy; b.vx *= .985; b.vy = b.vy * .985 + .03; b.life -= b.decay; b.tw += .25;
      ctx.globalAlpha = Math.max(0, b.life) * (.6 + .4 * Math.sin(b.tw));
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    };
    return b;
  }));
}

// ===== Stage 2: build the extra details (laurel + stars) =====
const SVGNS = "http://www.w3.org/2000/svg";
function svgPath(parent, d, cls, at, dur, fill) {
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", d);
  if (cls) { p.setAttribute("class", cls); p.dataset.at = at; p.dataset.d = dur; }
  if (fill) p.setAttribute("fill", fill);
  parent.appendChild(p);
  return p;
}

(function buildLaurel() {
  const g = document.getElementById("laurel");
  const fills = document.getElementById("fills");
  // One branch = a curved stem (quadratic Bezier) with pairs of leaves along it.
  // The right branch is the left one mirrored (x -> 260 - x).
  for (const side of [1, -1]) {
    const X = x => (side === 1 ? x : 260 - x).toFixed(1);
    const P0 = [124, 214], P1 = [44, 206], P2 = [34, 122];
    svgPath(g, `M${X(P0[0])} ${P0[1]} Q${X(P1[0])} ${P1[1]} ${X(P2[0])} ${P2[1]}`, "stroke", 2600, 1200);
    const pt = t => [0, 1].map(k => (1 - t) ** 2 * P0[k] + 2 * (1 - t) * t * P1[k] + t * t * P2[k]);
    const tan = t => [0, 1].map(k => 2 * (1 - t) * (P1[k] - P0[k]) + 2 * t * (P2[k] - P1[k]));
    let i = 0;
    for (let t = .14; t <= .96; t += .12, i++) {
      const [bx, by] = pt(t);
      const [tx, ty] = tan(t);
      const base = Math.atan2(ty, tx);
      const size = 15 - t * 5;
      for (const turn of [-.6, .6]) {
        const a = base + turn, ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
        const tip = [bx + ux * size, by + uy * size];
        const c1 = [bx + ux * size / 2 + nx * size * .32, by + uy * size / 2 + ny * size * .32];
        const c2 = [bx + ux * size / 2 - nx * size * .32, by + uy * size / 2 - ny * size * .32];
        const f = v => v.toFixed(1);
        const d = `M${X(bx)} ${f(by)} Q${X(c1[0])} ${f(c1[1])} ${X(tip[0])} ${f(tip[1])} Q${X(c2[0])} ${f(c2[1])} ${X(bx)} ${f(by)} Z`;
        svgPath(g, d, "stroke thin", 2900 + i * 160, 450);
        svgPath(fills, d, null, 0, 0, "#c98a52");
      }
    }
  }
})();

(function buildStars() {
  const g = document.getElementById("stars");
  const star = (x, y, s) => `M${x} ${y - s} Q${x} ${y} ${x + s} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s} ${y} Q${x} ${y} ${x} ${y - s} Z`;
  [[22, 34, 7], [238, 40, 6], [130, 12, 5], [62, 18, 4], [200, 16, 4]].forEach(([x, y, s], i) => {
    svgPath(g, star(x, y, s), "stroke thin", 3900 + i * 120, 400);
  });
})();

// ===== Stage 2: draw, fill, then turn into dust =====
const DRAW_SPEED = 0.55; // 1 = slow (about 4.5s), smaller = faster
async function goStage2() {
  if (stage !== 1) return;
  stage = 2;
  document.documentElement.classList.add("warm");
  const intro = document.getElementById("intro");
  intro.classList.add("gone");
  await sleep(400);
  intro.remove();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return goStage3();

  const show = document.getElementById("show");
  const cap = document.getElementById("cap");
  document.querySelectorAll("#show [data-t]").forEach(el => el.textContent = TEXT[lang][el.dataset.t]);
  // Each line starts hidden: dash = full length, offset = full length. Then offset -> 0 "draws" it.
  const strokes = [...cap.querySelectorAll(".stroke")];
  strokes.forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = `stroke-dashoffset ${p.dataset.d * DRAW_SPEED}ms cubic-bezier(.55, 0, .35, 1) ${p.dataset.at * DRAW_SPEED}ms`;
  });
  show.classList.add("on");
  await sleep(50);
  strokes.forEach(p => p.style.strokeDashoffset = 0);
  await sleep(4500 * DRAW_SPEED);                      if (stage !== 2) return;

  cap.classList.add("filled");
  const r = cap.getBoundingClientRect();
  sparkBurst(r.left + r.width / 2, r.top + r.height * .35, 90);
  document.querySelector(".show-text").classList.add("on");
  await sleep(1800);                                   if (stage !== 2) return;

  await dissolve();
  goStage3();
}

// Take a "photo" of the cap + text on a hidden canvas, then turn every few pixels into a grain of sand.
async function dissolve() {
  const stageEl = document.querySelector("#show .stage");
  const cap = document.getElementById("cap");
  const W = innerWidth, H = innerHeight;
  const snap = document.createElement("canvas");
  snap.width = W; snap.height = H;
  const sctx = snap.getContext("2d", { willReadFrequently: true });

  try {
    // 1) the cap: copy the SVG with its final colors written inline, then draw it as an image
    cap.querySelector("#tassel").style.animation = "none";
    const r = cap.getBoundingClientRect();
    const clone = cap.cloneNode(true);
    const src = cap.querySelectorAll("*"), dst = clone.querySelectorAll("*");
    src.forEach((el, i) => {
      if (el.closest("defs")) return;
      const cs = getComputedStyle(el);
      dst[i].removeAttribute("class");
      dst[i].setAttribute("style", `fill:${cs.fill};stroke:${cs.stroke};stroke-width:${cs.strokeWidth};opacity:${cs.opacity};stroke-linecap:round;stroke-linejoin:round`);
    });
    clone.setAttribute("width", r.width);
    clone.setAttribute("height", r.height);
    clone.setAttribute("xmlns", SVGNS);
    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    await img.decode();
    sctx.drawImage(img, r.left, r.top, r.width, r.height);

    // 2) the text lines
    await document.fonts.ready;
    for (const el of document.querySelectorAll(".show-text > div")) {
      const cs = getComputedStyle(el), b = el.getBoundingClientRect();
      sctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      if ("letterSpacing" in sctx) sctx.letterSpacing = cs.letterSpacing;
      sctx.fillStyle = cs.color;
      sctx.textAlign = "center"; sctx.textBaseline = "middle";
      const text = cs.textTransform === "uppercase" ? el.textContent.toUpperCase() : el.textContent;
      sctx.fillText(text, b.left + b.width / 2, b.top + b.height / 2);
    }

    // 3) pixels -> grains
    const data = sctx.getImageData(0, 0, W, H).data;
    const step = W < 600 ? 3 : 2;
    let minX = W, maxX = 0;
    const grains = [];
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const k = (y * W + x) * 4;
        if (data[k + 3] < 60) continue;
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        grains.push({ x, y, color: `rgb(${data[k]},${data[k + 1]},${data[k + 2]})` });
      }
    }
    const SWEEP = 1400; // ms for the "wind" to cross the cap from left to right
    const t0 = performance.now();
    const span = Math.max(1, maxX - minX);
    fx.add(grains.map(g => {
      // grains on the left leave first; each one waits until the wind reaches it
      const delay = (g.x - minX) / span * SWEEP + Math.random() * 200;
      const b = { ...g, life: 1, vx: .4 + Math.random() * 1.4, vy: -(.2 + Math.random() * .9),
                  wob: Math.random() * 6, fade: .008 + Math.random() * .012 };
      b.step = (ctx, now) => {
        if (now - t0 < delay) return; // not reached yet: the real cap is still showing here
        b.wob += .08;
        b.x += b.vx + Math.sin(b.wob) * .4; b.y += b.vy; b.vx *= 1.01; b.life -= b.fade;
        ctx.globalAlpha = Math.max(0, b.life);
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, step, step);
      };
      return b;
    }));
    // Erase the real cap with a moving mask: left of the edge = transparent, right = still visible.
    const box = stageEl.getBoundingClientRect();
    (function sweep(now) {
      const edge = minX + span * Math.min(1, (now - t0) / SWEEP) - box.left;
      const m = `linear-gradient(to right, transparent ${edge - 10}px, #000 ${edge + 10}px)`;
      stageEl.style.webkitMaskImage = stageEl.style.maskImage = m;
      if (now - t0 < SWEEP + 100) requestAnimationFrame(sweep);
      else stageEl.classList.add("hide");
    })(t0);
    await sleep(SWEEP + 1500);
  } catch (err) {
    // If the browser blocks reading the canvas, just fade out instead.
    console.warn("dust effect skipped:", err);
    stageEl.classList.add("hide");
    await sleep(600);
  }
}

async function goStage3() {
  if (stage === 3) return;
  stage = 3;
  const show = document.getElementById("show");
  show.classList.add("gone");
  await sleep(700);
  show.remove();
  render();
  const fin = document.getElementById("final");
  fin.classList.add("on");
  window.scrollTo(0, 0);
  void fin.offsetWidth; // forced reflow: the browser applies opacity 0 first, so the fade to 1 is animated
  fin.classList.add("visible");
}

runIntro();
</script>
